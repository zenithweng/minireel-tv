name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: node tool/release.cjs metadata

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tool/release.test.cjs
      - name: Build Windows
        run: flutter build windows --release --build-name "$env:RELEASE_VERSION" --build-number "$env:RELEASE_BUILD_NUMBER"
      - name: Ensure Inno Setup is available
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows installer
        run: ./tool/build_windows_installer.ps1 -Version $env:RELEASE_VERSION -BuildNumber ([int]$env:RELEASE_BUILD_NUMBER)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: output/release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [metadata, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-windows
          path: release
      - name: Publish GitHub Release (Windows only)
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'This release is already published. Use a new version tag.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MiniReel $RELEASE_VERSION (Windows)" --generate-notes --prerelease="$RELEASE_PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE"
